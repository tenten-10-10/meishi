<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SHOWASHOKAI – Signature</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <style>
    :root{
      --font:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',
              'Noto Sans JP',Meiryo,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      --border:#e7e8ed;
      --text:#1f2328;
      --muted:#2d3137;
      --accent:#0f6f56;
      --shadow:0 18px 48px rgba(16,24,40,.10),0 4px 10px rgba(16,24,40,.06);
    }
    * { box-sizing:border-box; }

    html,body{
      height:100%;
      margin:0;
      font-family:var(--font);
      background:#f7f9fb;
      color:var(--text);
      /* スクロール禁止（コンテンツが必ず画面内に収まるようサイズ制御） */
      overflow:hidden;
      overscroll-behavior:none;
      -webkit-text-size-adjust:100%;
    }

    /* 全体ステージ：中央固定配置 */
    .stage{
      position:fixed; inset:0;
      padding:clamp(12px,3vw,28px);
      display:flex; align-items:center; justify-content:center;
      gap:0;
    }

    /* カード：PCでもスマホでも常に画面内に収まる幅・高さに */
    .card{
      width:clamp(320px, 92vw, 760px);
      /* 高さは画面高からパディングぶんを引いた中で最大でも420px程度 */
      max-height:min(78vh, 420px);
      background:#fff; border:1px solid var(--border); border-radius:16px;
      box-shadow:var(--shadow);
      display:flex; flex-direction:column;
    }

    /* ヘッダー（macOSウィンドウ風） */
    .card__head{
      display:flex; align-items:center; gap:12px;
      border-bottom:1px solid var(--border);
      padding:12px 16px; border-top-left-radius:16px; border-top-right-radius:16px;
    }
    .dots{ display:flex; gap:10px; align-items:center; }
    .dot{ width:12px; height:12px; border-radius:50%; display:block; }
    .dot--r{ background:#ff5f57; }   /* 緊急メール */
    .dot--y{ background:#febc2e; }   /* Googleマップ */
    .dot--g{ background:#28c840; }   /* 名刺ページ */

    .title{ font:13px/1 var(--font); color:#7d8590; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* 本文エリアはグリッドで2カラム。中身が多い場合は自身内でスクロールしないよう
       フォントサイズを可変にし、max-height内に収める */
    .card__body{
      display:grid; grid-template-columns:1fr 1fr; gap:12px;
      padding:16px 18px 18px;
      border-bottom-left-radius:16px; border-bottom-right-radius:16px;
      min-height:0; /* flexアイテムの内側スクロール抑止 */
    }

    .pane{
      border:1px solid var(--border); border-radius:12px;
      padding:16px 18px; min-height:0;
    }

    .name{ font-weight:700; font-size:clamp(18px, 2.8vw, 22px); line-height:1.5; margin:0 0 6px; }
    .row { font-size:clamp(13px, 2.2vw, 15px); line-height:1.85; color:var(--muted); }

    a{ color:var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    /* スマホ幅：ページ固定・文字＆余白をわずかに拡大、ドットも14pxに */
    @media (max-width:540px){
      .stage{ padding:16px; }
      .card{ width:94vw; max-height:86vh; border-radius:16px; }
      .card__head{ padding:12px 16px; }
      .dots .dot{ width:14px; height:14px; }
      .title{ font-size:13px; }
      .card__body{ gap:10px; padding:18px 20px 20px; }
      .pane{ padding:18px 20px; }
      /* 2カラムを維持することで縦の占有を抑え、縦スクロール不要に */
      .name{ font-size:clamp(19px, 4.8vw, 22px); }
      .row { font-size:clamp(14px, 3.6vw, 16.5px); line-height:1.9; }
    }

    /* さらに狭い端末では、最終手段として字間を少し詰めて高さ調整 */
    @media (max-width:360px){
      .row{ letter-spacing:-0.01em; }
    }

    /* 視覚効果を抑制したい端末向け（OS設定） */
    @media (prefers-reduced-motion: reduce){
      *{ animation:none!important; transition:none!important; }
    }
  </style>
</head>

  </div>
