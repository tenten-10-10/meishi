<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SHOWASHOKAI – Glass Tilt Card (Gloss + Window Buttons)</title>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,Segoe UI,Roboto,Helvetica,Arial,sans-serif;--text:#0f1b1a;--muted:#3e4a49;--edge:#dfe9ee;--acc:#0f6f56;}
html,body{height:100%;margin:0;overflow:hidden;font-family:var(--font);}

/* 背景：濃いめ */
.bg{position:fixed;inset:0;background:
radial-gradient(1600px 900px at 75% 20%, rgba(32,66,72,.45), transparent 55%),
radial-gradient(1400px 800px at 20% 75%, rgba(17,48,45,.50), transparent 60%),
linear-gradient(180deg, #0b2f33 0%, #0a2427 50%, #061b1e 100%);
filter:saturate(110%);transition:opacity .6s ease, transform .6s ease;}
.bg:after{content:"";position:absolute;inset:-20%;pointer-events:none;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='0 0.015 0'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
opacity:.22;mix-blend-mode:overlay}

.stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1100px;padding:clamp(10px,3vw,28px);transition:opacity .6s ease, transform .6s ease;}
.card-wrap{width:min(780px,92vw);aspect-ratio:780/460;transform-style:preserve-3d;position:relative;transition:transform .6s cubic-bezier(.2,.8,.2,1);}
.card-wrap.min{transform:translate(-42vw,42vh) scale(.22);transform-origin:center;pointer-events:none;}

/* ガラスカード */
.card{--ang:45deg; --spec: .6; position:absolute;inset:0;border-radius:24px;
background:
radial-gradient(1200px 700px at 85% 80%, rgba(15,111,86,.12), transparent 60%),
radial-gradient(1000px 600px at 12% 18%, rgba(56,189,248,.16), transparent 60%),
linear-gradient(180deg, rgba(255,255,255,.90), rgba(255,255,255,.78));
-webkit-backdrop-filter: blur(8px);backdrop-filter: blur(8px);
border:1px solid var(--edge);
box-shadow:0 50px 100px rgba(0,0,0,.35), 0 16px 30px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.55);
transform:rotateX(0) rotateY(0) translateZ(0);transform-style:preserve-3d;transition:transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .18s;overflow:hidden;}
.card-wrap.min .card{transform:rotateX(0) rotateY(0) translateZ(0)!important;box-shadow:0 18px 30px rgba(0,0,0,.3);}
.card.hover{box-shadow:0 70px 130px rgba(0,0,0,.45), 0 26px 40px rgba(0,0,0,.26);}

/* エッジ光沢 */
.card::before{content:"";position:absolute;inset:0;border-radius:24px;padding:1.2px;
background: linear-gradient(135deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.15) 35%, rgba(255,255,255,.55) 52%, rgba(255,255,255,.08) 68%, rgba(255,255,255,.75) 100%);
-webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
-webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none;mix-blend-mode:screen;opacity:.85;transform:translateZ(2px);}

/* スペキュラー */
.specular{content:"";position:absolute;inset:-15%;pointer-events:none;mix-blend-mode:screen;
background: conic-gradient(from var(--ang) at 50% 50%,
rgba(255,255,255,0) 0turn,
rgba(255,255,255,.35) calc(0.06turn + var(--spec)*.02),
rgba(255,255,255,0) calc(0.14turn + var(--spec)*.05),
rgba(255,255,255,0) 1turn);
filter: blur(24px) saturate(120%);opacity:.9;transform:translateZ(60px);}
.edgeGloss{position:absolute;inset:0;pointer-events:none;border-radius:24px;mix-blend-mode:screen;transform:translateZ(40px);}
.edgeGloss::before, .edgeGloss::after{content:"";position:absolute;border-radius:inherit;inset:-1px;filter: blur(10px);}
.edgeGloss::before{background:linear-gradient(var(--ang), rgba(255,255,255,.55), rgba(255,255,255,0) 35%);}
.edgeGloss::after{background:linear-gradient(calc(var(--ang) + 180deg), rgba(255,255,255,.22), rgba(255,255,255,0) 45%);}
.sheen{position:absolute;inset:-10% -40% 30% -40%; pointer-events:none; mix-blend-mode:screen;
background: linear-gradient( to right, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0) );
transform: translateZ(70px) rotate(8deg); filter: blur(10px); opacity:.0; transition: opacity .2s ease;}
.card.active .sheen{opacity:.5;}

/* macOS 風ウィンドウボタン */
.traffic{position:absolute;top:12px;left:14px;display:flex;gap:8px;z-index:10;transform:translateZ(90px);}
.dot{width:12px;height:12px;border-radius:50%;box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.15);border:1px solid rgba(0,0,0,.1);}
.dot.red{background: radial-gradient(circle at 30% 30%, #ff9386, #ff5f57 60%);}
.dot.yellow{background: radial-gradient(circle at 30% 30%, #ffe79a, #febc2e 60%);}
.dot.green{background: radial-gradient(circle at 30% 30%, #a3f1b6, #28c840 60%);}
.dot:active{transform:scale(.92);}
.dot:hover{filter:saturate(115%);}
/* ツールチップ */
.dot[title]{position:relative}
.dot[title]:hover::before{content:attr(title);position:absolute;left:50%;top:140%;transform:translateX(-50%);background:#1f2937;color:#fff;font-size:11px;padding:4px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:.9;}

/* 内容 */
.inner{position:absolute;inset:0;padding:28px 34px 30px 34px;transform:translateZ(26px);display:grid;gap:18px;align-content:start;color:var(--text);}
.logo img{height:36px;display:block;object-fit:contain}
.name{font-weight:800;font-size:26px;letter-spacing:.02em;margin:.3rem 0 2px}
.row{font-size:16px;line-height:1.9;color:var(--muted);}
.row a{color:#0e6e8c;text-decoration:none} .row a:hover{text-decoration:underline}

/* スマホ最適化 */
@media (max-width:560px){
  .card-wrap{width:min(720px,96vw); aspect-ratio: 720/540;}
  .inner{padding:18px 18px; gap:10px}
  .logo img{height:26px}
  .name{font-size:clamp(17px, 5.2vw, 21px);}
  .row{font-size:clamp(12px, 3.3vw, 14px); line-height:1.6;}
  .traffic{top:10px;left:10px;gap:7px}
}
@media (max-width:380px){
  .card-wrap{aspect-ratio: 360/300;}
  .name{font-size:clamp(16px, 5.1vw, 19px);}
  .row{font-size:clamp(11.5px, 3.2vw, 13px);}
}

/* 閉じるオーバーレイ */
.closeOverlay{position:fixed;inset:0;background:rgba(39,45,49,.0);backdrop-filter:saturate(120%) blur(0px);opacity:0;pointer-events:none;transition:opacity .45s ease, background .45s ease, backdrop-filter .45s ease;}
body.closing .closeOverlay{opacity:1;background:rgba(39,45,49,.85);backdrop-filter:saturate(120%) blur(2px);}
body.closing .stage, body.closing .bg{opacity:.0;transform:scale(.98);}
body.closed .stage, body.closed .bg{display:none;}
</style>
</head>

<script>
(()=>{
  const wrap=document.getElementById('wrap');
  const card=document.getElementById('card');
  const btnMin=document.getElementById('btnMin');
  const btnGo=document.getElementById('btnGo');
  const btnClose=document.getElementById('btnClose');

  let rect,cx,cy,active=false;
  const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
  function setRect(){rect=wrap.getBoundingClientRect();cx=rect.left+rect.width/2;cy=rect.top+rect.height/2;} setRect();
  window.addEventListener('resize',setRect);

  function applyTilt(x,y){
    const dx=(x-cx)/(rect.width/2);
    const dy=(y-cy)/(rect.height/2);
    const max=12;
    const rx=clamp(-dy*max,-max,max);
    const ry=clamp(dx*max,-max,max);
    card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
    const ang=Math.atan2(dy,dx)*180/Math.PI;
    const strength=Math.min(1, Math.hypot(dx,dy));
    card.style.setProperty('--ang', (ang+90)+'deg');
    card.style.setProperty('--spec', String(strength));
  }

  function onMove(e){ if(!active) return; if(e.type==='touchmove'){const t=e.touches[0];applyTilt(t.clientX,t.clientY);}
    else{applyTilt(e.clientX,e.clientY);} }
  function activate(e){ if(wrap.classList.contains('min')) return;
    active=true;card.classList.add('active','hover');
    if(e.type==='touchstart'){const t=e.touches[0];applyTilt(t.clientX,t.clientY);}
    else{applyTilt(e.clientX,e.clientY);}
    window.addEventListener('mousemove',onMove,{passive:true});
    window.addEventListener('touchmove',onMove,{passive:true});
  }
  function deactivate(){active=false;card.classList.remove('active','hover');
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('touchmove',onMove);
    card.style.transform='rotateX(0deg) rotateY(0deg)';
    card.style.setProperty('--spec','.6');
  }
  wrap.addEventListener('mouseenter',activate);
  wrap.addEventListener('mouseleave',deactivate);
  wrap.addEventListener('touchstart',activate,{passive:true});
  wrap.addEventListener('touchend',deactivate);
  wrap.addEventListener('touchcancel',deactivate);
  card.addEventListener('click',e=>{ if(active){ e.preventDefault(); e.stopPropagation(); deactivate(); } },true);

  // Yellow: minimize / restore
  function toggleMin(){ if(wrap.classList.contains('min')){ wrap.classList.remove('min'); }
    else{ deactivate(); wrap.classList.add('min'); } }
  btnMin.addEventListener('click',toggleMin,{passive:true});
  btnMin.addEventListener('touchstart',e=>{e.preventDefault();toggleMin();},{passive:false});

  // Green: site
  function goSite(){ if(wrap.classList.contains('min')){wrap.classList.remove('min'); return;}
    window.open('https://tenten-10-10.github.io/meishi/','_blank'); }
  btnGo.addEventListener('click',goSite,{passive:true});
  btnGo.addEventListener('touchstart',e=>{e.preventDefault();goSite();},{passive:false});

  // Red: gray-out then disappear
  function closeWin(){ document.body.classList.add('closing');
    setTimeout(()=>{ document.body.classList.add('closed'); }, 650); }
  btnClose.addEventListener('click',closeWin,{passive:true});
  btnClose.addEventListener('touchstart',e=>{e.preventDefault();closeWin();},{passive:false});
})();
</script>
