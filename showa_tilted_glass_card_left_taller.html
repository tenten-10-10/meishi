<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SHOWA – Interactive Glass Card (Left • Taller)</title>
<meta name="description" content="株式会社 昭和商会 インタラクティブ ガラスカード（左揃え・縦余白ゆったり）" />
<style>
  :root { color-scheme: light only; --card-w: 680px; --card-h: 380px; }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html { height: 100%; }
  body {
    min-height: 100vh; margin: 0; padding: 32px 18px;
    display: grid; place-items: center; background:
      radial-gradient(60% 80% at 50% 20%, #f7fbff, #eef6f2 60%, #eaf1ff 100%);
    font-family: 'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP', system-ui, -apple-system, Segoe UI, Arial, sans-serif;
  }
  .stage { width: calc(var(--card-w) + 36px); overflow: visible; padding: 18px; }
  .scene { perspective: 1000px; perspective-origin: 50% 40%; }
  .tilt-card {
    position: relative; width: var(--card-w); height: var(--card-h);
    border-radius: 16px; padding: 26px 28px; overflow: hidden;
    transform-style: preserve-3d;
    background: linear-gradient(0deg, rgba(255,255,255,.82), rgba(255,255,255,.68));
    border: 1px solid rgba(255,255,255,.94);
    box-shadow:
      0 20px 40px rgba(27,40,48,.15),
      inset 0 0 0 1px rgba(255,255,255,.50),
      inset 0 12px 26px rgba(255,255,255,.32),
      inset 0 -12px 26px rgba(0,0,0,.06);
    transition: box-shadow .25s ease, transform .25s ease;
    will-change: transform;
    user-select:none; -webkit-user-select:none;
  }
  .tilt-card.lift {
    box-shadow: 0 28px 60px rgba(27,40,48,.20),
                inset 0 0 0 1px rgba(255,255,255,.50),
                inset 0 14px 28px rgba(255,255,255,.34),
                inset 0 -14px 28px rgba(0,0,0,.07);
  }
  .bloom, .bloom2 {
    position:absolute; inset: -4px; border-radius: inherit; pointer-events:none;
    mix-blend-mode: screen;
  }
  .bloom {
    background:
      radial-gradient(46% 38% at 20% 8%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 48%),
      radial-gradient(64% 50% at 88% 88%, rgba(140,232,198,.16) 0%, rgba(140,232,198,0) 52%);
    filter: blur(8px);
  }
  .bloom2 {
    background:
      linear-gradient(18deg, rgba(255,255,255,.38) 12%, rgba(255,255,255,0) 38%),
      linear-gradient(18deg, rgba(255,255,255,.16) 30%, rgba(255,255,255,0) 62%);
    filter: blur(10px);
    opacity: .85; transform: translateZ(40px);
  }
  .glare {
    position:absolute; inset:-4px; border-radius:inherit; pointer-events:none;
    background: radial-gradient(60% 40% at var(--gx,50%) var(--gy,0%), rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
    filter: blur(10px); mix-blend-mode: screen; transform: translateZ(50px);
  }

  /* 左揃え・単一カラム（縦余白広め） */
  .row { display:flex; flex-direction:column; align-items:flex-start; gap: 12px; height: 100%; }
  .top { display:flex; align-items:center; gap:14px; transform: translateZ(20px); width:100%; justify-content:flex-start; }
  .logo { width: 180px; height:auto; display:block; filter: drop-shadow(0 1px 0 rgba(255,255,255,.4)); }
  .left { text-align:left; width: 100%; }
  h1.left { font-size: 22px; margin: 4px 0 2px 0; font-weight: 700; color:#1f252a; letter-spacing:.02em; transform: translateZ(18px); }
  p.left  { margin: 0; color:#2b2f34; font-size: 15px; line-height: 1.8; transform: translateZ(12px); }
  a  { color:#11161b; text-decoration: none; }

  @media (prefers-reduced-motion: reduce) {
    .scene { perspective: none; }
    .tilt-card, .tilt-card * { transform: none !important; }
    .bloom2, .glare { display:none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="scene">
      <article class="tilt-card" id="card" aria-label="SHOWA Interactive Card (Left • Taller)">
        <i class="bloom" aria-hidden="true"></i>
        <i class="bloom2" aria-hidden="true"></i>
        <i class="glare" id="glare" aria-hidden="true"></i>

        <div class="row">
          <div class="top">
            <!-- 同じフォルダに logo.png を置いてください -->
            <img class="logo" src="logo.png" width="180" height="61" alt="株式会社 昭和商会 ロゴ">
          </div>

          <h1 class="left">麦倉 弘人（ムギクラ ヒロト）</h1>
          <p class="left">株式会社 昭和商会 東京支店 営業企画部 商品企画課</p>
          <p class="left">〒141-0031</p>
          <p class="left">東京都品川区西五反田１丁目１６−５　西五反田一丁目ビル 4F</p>
          <p class="left">TEL: <a href="tel:+81363039614">03-6303-9614</a></p>
          <p class="left">FAX: <a href="tel:+81363039615">03-6303-9615</a></p>
          <p class="left">Mail: <a href="mailto:mugikura@showashokai.com">mugikura@showashokai.com</a></p>
        </div>
      </article>
    </section>
  </main>

<script>
(() => { 
  const card  = document.getElementById('card');
  const glare = document.getElementById('glare');
  const MAX = 10; // 最大傾き（度）
  let rect, raf, active = false;

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const setRAF = (fn) => { cancelAnimationFrame(raf); raf = requestAnimationFrame(fn); };

  function update(e) {
    if (!rect) rect = card.getBoundingClientRect();
    const isTouch = e.touches && e.touches.length;
    const cx = (isTouch ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (isTouch ? e.touches[0].clientY : e.clientY) - rect.top;
    const px = clamp(cx / rect.width, 0, 1);
    const py = clamp(cy / rect.height, 0, 1);
    const rotY = (px - .5) * MAX * 2;
    const rotX = -(py - .5) * MAX * 2;
    setRAF(() => {
      card.style.transform = `rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
      card.classList.add('lift');
      glare.style.setProperty('--gx', `${px*100}%`);
      glare.style.setProperty('--gy', `${py*100}%`);
    });
  }

  function reset() {
    rect = null; active = false;
    card.classList.remove('lift');
    setRAF(() => { card.style.transform = 'rotateX(0deg) rotateY(0deg)'; });
  }

  card.addEventListener('pointerenter', e => { active = true; update(e); });
  card.addEventListener('pointermove',  e => { if (active) update(e); });
  card.addEventListener('pointerleave', reset);
  card.addEventListener('touchstart', e => { active = true; update(e); }, {passive:true});
  card.addEventListener('touchmove',  e => { if (active) update(e); }, {passive:true});
  card.addEventListener('touchend',   reset, {passive:true});
})();
</script>
</body>
</html>
