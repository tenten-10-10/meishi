<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOWASHOKAI — Dim</title>
<style>
  html,body{margin:0;height:100%;background:#f5f7f9}
  .wrap{position:fixed;inset:0;background:rgba(20,28,33,.55);backdrop-filter:saturate(120%) blur(6px);}
</style>
</head>
<body>
<div class="wrap" aria-hidden="true"></div>
<script>
(function(){
  function backOrClose(ev){
    ev.preventDefault();
    if (history.length > 1) { history.back(); return; }
    try { window.close(); } catch(e){}
  }
  document.addEventListener('click', backOrClose, {passive:false});
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' || e.key === 'Backspace') backOrClose(e);
  }, {passive:false});
})();
</script>
</body>
</html>
